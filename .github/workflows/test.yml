# The model-free test suite. No test loads a model or imports torch,
# sentence-transformers or transformers, so CI installs requirements-ci.txt
# only: no weights, no Ollama, no data/. The tests that read the gitignored
# statute corpus skip here by design.
name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned by commit SHA, a tag being movable; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the test dependencies
        run: pip install -c constraints.txt -r requirements-ci.txt
      - name: Run the tests
        run: python -m pytest -q
